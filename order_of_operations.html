<style>

    --bg: #F2F5F8; --surface: #FFFFFF; --surface-2: #E7ECF1; --fg: #182430; --fg-muted: #5B6B7A;

    --accent-b-soft: #D9F0EE; --code-bg: #10161F; --code-fg: #E7EEF3; --code-muted: #7C8CA0;
    --shadow: 0 1px 2px rgba(20,30,40,.06), 0 10px 28px rgba(20,30,40,.07);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0D131E; --surface: #161F2C; --surface-2: #1E2836; --fg: #E7EEF5; --fg-muted: #8FA0B2;
      --border: #2B3A4C; --accent-a: #FF7A92; --accent-a-soft: #3A2028; --accent-b: #35DCCF;
      --accent-b-soft: #123330; --code-bg: #090D14; --code-fg: #DCE6EE; --code-muted: #5E7488;
      --shadow: 0 1px 2px rgba(0,0,0,.5), 0 14px 32px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0D131E; --surface: #161F2C; --surface-2: #1E2836; --fg: #E7EEF5; --fg-muted: #8FA0B2;
    --border: #2B3A4C; --accent-a: #FF7A92; --accent-a-soft: #3A2028; --accent-b: #35DCCF;
    --accent-b-soft: #123330; --code-bg: #090D14; --code-fg: #DCE6EE; --code-muted: #5E7488;
    --shadow: 0 1px 2px rgba(0,0,0,.5), 0 14px 32px rgba(0,0,0,.4);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: 'IBM Plex Sans', system-ui, sans-serif; }
  .page { max-width: 900px; margin: 0 auto; padding: 48px 24px 64px; display: flex; flex-direction: column; gap: 24px; }

  h1 { margin: 0; font-size: clamp(1.5rem, 3vw, 2.05rem); font-weight: 700; letter-spacing: -0.01em; }

  header p code { color: var(--fg); }
  code, .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
  html.embed .page { padding: 4px 4px 20px; }
  html.embed header { display: none; }

  .tabs { display: flex; gap: 8px; }
  .tabs button { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13px; font-weight: 600; border-radius: 999px; padding: 8px 16px; cursor: pointer; border: 1.5px solid var(--border); background: var(--surface); color: var(--fg-muted); }
  .tabs button.active { color: var(--fg); border-color: var(--accent-b); background: var(--accent-b-soft); }

  .expr-panel { background: var(--code-bg); color: var(--code-fg); border-radius: 14px; padding: 28px 24px; box-shadow: var(--shadow); border: 1px solid rgba(255,255,255,.06); display: flex; align-items: center; justify-content: center; min-height: 100px; }
  .expr-panel .expr { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 22px; display: flex; align-items: baseline; gap: 4px; flex-wrap: wrap; justify-content: center; }
  .tok { padding: 3px 6px; border-radius: 6px; transition: background .35s ease, color .35s ease, opacity .35s ease; }

  .caption-box { min-height: 60px; font-size: 15px; color: var(--fg-muted); line-height: 1.55; padding: 14px 16px; background: var(--surface-2); border-radius: 10px; border: 1px solid var(--border); }
  .caption-box b { color: var(--fg); font-weight: 600; }
  .caption-box code { color: var(--fg); }

  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  button.ctrl { font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 14.5px; font-weight: 600; border-radius: 10px; padding: 11px 18px; cursor: pointer; border: 1.5px solid var(--border); background: var(--surface); color: var(--fg); display: inline-flex; align-items: center; gap: 9px; transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease; }
  button.ctrl:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
  button.ctrl .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  button.btn-step .dot { background: var(--accent-b); }
  button.btn-step:hover { border-color: var(--accent-b); }

<div class="page">
  <header>
    <span class="eyebrow">Week 1 · Numbers and Arithmetic</span>
    <h1>Python evaluates in a fixed order, not left to right</h1>
    <p>Multiplication and division happen before addition and subtraction — and among
      themselves, strictly left to right. Parentheses override the default order entirely.</p>
  </header>

  <div class="tabs">
    <button id="tab-default" class="active">value / limit * 100</button>
    <button id="tab-paren">value / (limit * 100)</button>
  </div>

  <div class="expr-panel">
    <div class="expr" id="expr"></div>
  </div>

  <div class="caption-box mono" id="caption" aria-live="polite"></div>

  <div class="controls">
    <button class="ctrl btn-step" id="btn-step"><span class="dot"></span>Step forward</button>
    <button class="ctrl btn-reset" id="btn-reset"><span class="dot"></span>Reset</button>
  </div>
</div>

<script>
(function () {
  var exprEl = document.getElementById('expr');
  var caption = document.getElementById('caption');
  var btnStep = document.getElementById('btn-step');
  var btnReset = document.getElementById('btn-reset');
  var tabDefault = document.getElementById('tab-default');
  var tabParen = document.getElementById('tab-paren');

  var mode = 'default'; // or 'paren'
  var step = 0;

  var sequences = {
    default: {
      steps: [
        'value / limit * 100',
        '<span class="tok highlight-a">120 / 100</span> * 100',
        '<span class="tok dim">1.2</span> * 100',
        '<span class="tok highlight-b">1.2 * 100</span>',
        '120.0'
      ],
      captions: [
        'value = 120, limit = 100. Python scans left to right among equal-precedence operators — / and * tie, so the leftmost runs first.',
        '<code>value / limit</code> evaluates first: <b>120 / 100 = 1.2</b>.',
        'That sub-result collapses to a single number — the division is done, it cannot be revisited.',
        'Now <code>1.2 * 100</code> runs, using the collapsed result — never <code>limit * 100</code> first.',
        'Final result: <b>120.0</b>. Division and multiplication tie in precedence, so left-to-right order decided it.'
      ]
    },
    paren: {
      steps: [
        'value / <span class="tok ghost-wrap">(limit * 100)</span>',
        'value / <span class="tok highlight-a">(100 * 100)</span>',
        'value / <span class="tok dim">10000</span>',
        '<span class="tok highlight-b">120 / 10000</span>',
        '0.012'
      ],
      captions: [
        'Parentheses force their contents to evaluate first, regardless of position or the normal left-to-right tie-break.',
        '<code>limit * 100</code> runs first because it is inside brackets: <b>100 * 100 = 10000</b>.',
        'That collapses to a single number before anything outside the brackets runs.',
        'Now <code>value / 10000</code> runs: <b>120 / 10000</b>.',
        'Final result: <b>0.012</b> — a completely different answer to the same numbers, because the brackets changed the order.'
      ]
    }
  };

  function render() {
    var seq = sequences[mode];
    exprEl.innerHTML = seq.steps[step];
    caption.innerHTML = seq.captions[step];
    btnStep.disabled = step >= seq.steps.length - 1;
  }

  btnStep.addEventListener('click', function () {
    var seq = sequences[mode];
    if (step < seq.steps.length - 1) { step += 1; render(); }
  });
  btnReset.addEventListener('click', function () { step = 0; render(); });

  tabDefault.addEventListener('click', function () {
    mode = 'default'; step = 0;
    tabDefault.classList.add('active'); tabParen.classList.remove('active');
    render();
  });
  tabParen.addEventListener('click', function () {
    mode = 'paren'; step = 0;
    tabParen.classList.add('active'); tabDefault.classList.remove('active');
    render();
  });

  render();
})();
</script>
