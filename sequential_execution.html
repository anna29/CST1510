<meta charset="utf-8">
<title>Sequential Execution</title>
<script>if (location.search.indexOf('embed=1') !== -1) document.documentElement.className += ' embed';</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #F2F5F8; --surface: #FFFFFF; --surface-2: #E7ECF1; --fg: #182430; --fg-muted: #5B6B7A;
    --border: #C9D3DC; --accent-a: #D8425F; --accent-a-soft: #F6DDE2; --accent-b: #0E8F8B;
    --accent-b-soft: #D9F0EE; --code-bg: #10161F; --code-fg: #E7EEF3; --code-muted: #7C8CA0;
    --shadow: 0 1px 2px rgba(20,30,40,.06), 0 10px 28px rgba(20,30,40,.07);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0D131E; --surface: #161F2C; --surface-2: #1E2836; --fg: #E7EEF5; --fg-muted: #8FA0B2;
      --border: #2B3A4C; --accent-a: #FF7A92; --accent-a-soft: #3A2028; --accent-b: #35DCCF;
      --accent-b-soft: #123330; --code-bg: #090D14; --code-fg: #DCE6EE; --code-muted: #5E7488;
      --shadow: 0 1px 2px rgba(0,0,0,.5), 0 14px 32px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0D131E; --surface: #161F2C; --surface-2: #1E2836; --fg: #E7EEF5; --fg-muted: #8FA0B2;
    --border: #2B3A4C; --accent-a: #FF7A92; --accent-a-soft: #3A2028; --accent-b: #35DCCF;
    --accent-b-soft: #123330; --code-bg: #090D14; --code-fg: #DCE6EE; --code-muted: #5E7488;
    --shadow: 0 1px 2px rgba(0,0,0,.5), 0 14px 32px rgba(0,0,0,.4);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: 'IBM Plex Sans', system-ui, sans-serif; }
  .page { max-width: 900px; margin: 0 auto; padding: 48px 24px 64px; display: flex; flex-direction: column; gap: 28px; }
  header { display: flex; flex-direction: column; gap: 10px; }
  .eyebrow { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--fg-muted); }
  h1 { margin: 0; font-size: clamp(1.5rem, 3vw, 2.05rem); font-weight: 700; letter-spacing: -0.01em; }
  header p { margin: 0; max-width: 60ch; color: var(--fg-muted); font-size: 1.02rem; line-height: 1.55; }
  header p code { color: var(--fg); }
  code, .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
  html.embed .page { padding: 4px 4px 20px; }
  html.embed header { display: none; }

  .stage { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start; }
  .panel-label { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--fg-muted); margin-bottom: 10px; display: block; }

  .code-panel { background: var(--code-bg); color: var(--code-fg); border-radius: 14px; padding: 20px 22px; box-shadow: var(--shadow); border: 1px solid rgba(255,255,255,.06); }
  .code-line { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 14px; line-height: 2.1; padding: 3px 8px; border-radius: 6px; color: var(--code-muted); transition: background .3s ease, color .3s ease; }
  .code-line.done { color: var(--code-fg); }
  .code-line.active { background: var(--accent-b); color: #08201d; font-weight: 600; }

  .term-panel { background: var(--surface); border: 1.5px solid var(--border); border-radius: 14px; padding: 18px 20px 20px; box-shadow: var(--shadow); min-height: 220px; }
  .term-body { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 14px; line-height: 1.8; color: var(--fg); min-height: 120px; }
  .term-body .line { opacity: 0; transform: translateY(4px); transition: opacity .3s ease, transform .3s ease; }
  .term-body .line.shown { opacity: 1; transform: translateY(0); }
  .term-body .cursor { display: inline-block; width: 8px; height: 15px; background: var(--accent-b); vertical-align: text-bottom; animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .term-body .placeholder { color: var(--fg-muted); font-style: italic; }

  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  button { font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 14.5px; font-weight: 600; border-radius: 10px; padding: 11px 18px; cursor: pointer; border: 1.5px solid var(--border); background: var(--surface); color: var(--fg); display: inline-flex; align-items: center; gap: 9px; transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease; }
  button:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
  button:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
  button .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  button.btn-step .dot { background: var(--accent-b); }
  button.btn-step:hover { border-color: var(--accent-b); }
  button.btn-reset { color: var(--fg-muted); }
  button.btn-reset .dot { background: var(--fg-muted); }
  button:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }

  .status { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13.5px; color: var(--fg-muted); min-height: 1.4em; padding: 12px 14px; background: var(--surface-2); border-radius: 10px; border: 1px solid var(--border); }
  .status b { color: var(--fg); font-weight: 600; }

  @media (max-width: 620px) { .stage { grid-template-columns: 1fr; } }
  @media (prefers-reduced-motion: reduce) { * { transition-duration: .01ms !important; } .term-body .cursor { animation: none; } }
</style>

<div class="page">
  <header>
    <span class="eyebrow">Week 1 · Your First Program</span>
    <h1>One line finishes before the next begins</h1>
    <p>A program runs top to bottom, one statement at a time. Nothing in the output exists until
      its line has actually run — not a moment sooner.</p>
  </header>

  <figure class="stage-figure" aria-label="Diagram showing three print statements running one at a time into a terminal">
    <div class="stage">
      <div class="code-panel">
        <span class="panel-label" style="color:var(--code-muted);">your program</span>
        <div class="code-line" id="line-1">print(<span class="mono">"Checking record web1..."</span>)</div>
        <div class="code-line" id="line-2">print(<span class="mono">"Value: 120"</span>)</div>
        <div class="code-line" id="line-3">print(<span class="mono">"Status: OVER LIMIT"</span>)</div>
      </div>
      <div class="term-panel">
        <span class="panel-label">terminal</span>
        <div class="term-body" id="term-body">
          <span class="placeholder" id="term-placeholder">Nothing has run yet.</span>
          <div class="line" id="out-1">Checking record web1...</div>
          <div class="line" id="out-2">Value: 120</div>
          <div class="line" id="out-3">Status: OVER LIMIT</div>
          <span class="cursor" id="cursor" style="display:none;"></span>
        </div>
      </div>
    </div>
  </figure>

  <div class="controls">
    <button class="btn-step" id="btn-step"><span class="dot"></span>Step forward</button>
    <button class="btn-reset" id="btn-reset"><span class="dot"></span>Reset</button>
  </div>

  <div class="status mono" id="status" aria-live="polite">Idle — nothing has run yet. Press "Step forward" to run line 1.</div>
</div>

<script>
(function () {
  var lines = ['line-1', 'line-2', 'line-3'];
  var outs = ['out-1', 'out-2', 'out-3'];
  var step = 0;
  var placeholder = document.getElementById('term-placeholder');
  var cursor = document.getElementById('cursor');
  var status = document.getElementById('status');
  var btnStep = document.getElementById('btn-step');
  var btnReset = document.getElementById('btn-reset');

  function render() {
    lines.forEach(function (id, i) {
      var el = document.getElementById(id);
      el.classList.remove('active', 'done');
      if (i < step) el.classList.add('done');
      if (i === step && step < 3) el.classList.add('active');
    });
    outs.forEach(function (id, i) {
      document.getElementById(id).classList.toggle('shown', i < step);
    });
    placeholder.style.display = step === 0 ? '' : 'none';
    cursor.style.display = step > 0 && step < 3 ? 'inline-block' : 'none';

    if (step === 0) {
      status.innerHTML = 'Idle — nothing has run yet. Press "Step forward" to run line 1.';
    } else if (step < 3) {
      status.innerHTML = 'Line <b>' + step + '</b> has run. Line ' + (step + 1) + ' has not started — nothing about it exists yet.';
    } else {
      status.innerHTML = 'All three lines have run, in order. Line 3 could not have run before line 2 finished.';
    }
    btnStep.disabled = step >= 3;
  }

  btnStep.addEventListener('click', function () {
    if (step < 3) { step += 1; render(); }
  });
  btnReset.addEventListener('click', function () { step = 0; render(); });

  render();
})();
</script>
