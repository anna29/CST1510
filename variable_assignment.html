<meta charset="utf-8">
<title>Variable Assignment</title>
<script>if (location.search.indexOf('embed=1') !== -1) document.documentElement.className += ' embed';</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #F2F5F8; --surface: #FFFFFF; --surface-2: #E7ECF1; --fg: #182430; --fg-muted: #5B6B7A;
    --border: #C9D3DC; --accent-a: #D8425F; --accent-a-soft: #F6DDE2; --accent-b: #0E8F8B;
    --accent-b-soft: #D9F0EE; --code-bg: #10161F; --code-fg: #E7EEF3; --code-muted: #7C8CA0;
    --shadow: 0 1px 2px rgba(20,30,40,.06), 0 10px 28px rgba(20,30,40,.07); --idle-line: var(--border);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0D131E; --surface: #161F2C; --surface-2: #1E2836; --fg: #E7EEF5; --fg-muted: #8FA0B2;
      --border: #2B3A4C; --accent-a: #FF7A92; --accent-a-soft: #3A2028; --accent-b: #35DCCF;
      --accent-b-soft: #123330; --code-bg: #090D14; --code-fg: #DCE6EE; --code-muted: #5E7488;
      --shadow: 0 1px 2px rgba(0,0,0,.5), 0 14px 32px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0D131E; --surface: #161F2C; --surface-2: #1E2836; --fg: #E7EEF5; --fg-muted: #8FA0B2;
    --border: #2B3A4C; --accent-a: #FF7A92; --accent-a-soft: #3A2028; --accent-b: #35DCCF;
    --accent-b-soft: #123330; --code-bg: #090D14; --code-fg: #DCE6EE; --code-muted: #5E7488;
    --shadow: 0 1px 2px rgba(0,0,0,.5), 0 14px 32px rgba(0,0,0,.4);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: 'IBM Plex Sans', system-ui, sans-serif; }
  .page { max-width: 900px; margin: 0 auto; padding: 48px 24px 64px; display: flex; flex-direction: column; gap: 28px; }
  header { display: flex; flex-direction: column; gap: 10px; }
  .eyebrow { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--fg-muted); }
  h1 { margin: 0; font-size: clamp(1.5rem, 3vw, 2.05rem); font-weight: 700; letter-spacing: -0.01em; }
  header p { margin: 0; max-width: 60ch; color: var(--fg-muted); font-size: 1.02rem; line-height: 1.55; }
  header p code { color: var(--fg); }
  code, .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
  html.embed .page { padding: 4px 4px 20px; }
  html.embed header { display: none; }

  .stage { position: relative; min-height: 260px; }
  .connectors { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; z-index: 1; }
  .connectors path { fill: none; stroke: var(--idle-line); stroke-width: 2; stroke-linecap: round; transition: stroke .35s ease, d .35s ease; }
  .connectors path.accent-x { stroke: var(--accent-a); }
  .connectors path.accent-y { stroke: var(--accent-b); }
  .connectors path.fading { opacity: 0; transition: opacity .35s ease; }

  .names-col { position: absolute; left: 0; top: 0; display: flex; flex-direction: column; gap: 60px; z-index: 2; }
  .name-tag { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 16px; font-weight: 600; background: var(--surface); border: 1.5px solid var(--border); border-radius: 10px; padding: 10px 18px; box-shadow: var(--shadow); opacity: 0; transform: translateX(-6px); transition: opacity .3s ease, transform .3s ease, border-color .3s ease; min-width: 46px; text-align: center; }
  .name-tag.shown { opacity: 1; transform: translateX(0); }
  .name-tag.x { border-color: var(--accent-a); color: var(--accent-a); }
  .name-tag.y { border-color: var(--accent-b); color: var(--accent-b); }

  .values-col { position: absolute; right: 0; top: 0; display: flex; flex-direction: column; gap: 30px; z-index: 2; align-items: flex-end; }
  .value-bubble { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 20px; font-weight: 700; background: var(--code-bg); color: var(--code-fg); border-radius: 999px; width: 74px; height: 74px; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow); opacity: 0; transform: scale(.8); transition: opacity .3s ease, transform .3s ease; }
  .value-bubble.shown { opacity: 1; transform: scale(1); }
  .value-bubble.stale { opacity: .35; }

  .caption-box { min-height: 60px; font-size: 15px; color: var(--fg-muted); line-height: 1.55; padding: 14px 16px; background: var(--surface-2); border-radius: 10px; border: 1px solid var(--border); }
  .caption-box b { color: var(--fg); font-weight: 600; }
  .caption-box code { color: var(--fg); }

  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  button { font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 14.5px; font-weight: 600; border-radius: 10px; padding: 11px 18px; cursor: pointer; border: 1.5px solid var(--border); background: var(--surface); color: var(--fg); display: inline-flex; align-items: center; gap: 9px; transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease; }
  button:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
  button:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
  button .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  button.btn-step .dot { background: var(--accent-b); }
  button.btn-step:hover { border-color: var(--accent-b); }
  button.btn-reset { color: var(--fg-muted); }
  button.btn-reset .dot { background: var(--fg-muted); }
  button:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }

  @media (prefers-reduced-motion: reduce) { * { transition-duration: .01ms !important; } }
</style>

<div class="page">
  <header>
    <span class="eyebrow">Week 1 · Variables and Types</span>
    <h1>A name points at a value — it is not a box</h1>
    <p>Assignment does not copy a value into a container labelled with a name. It points a name
      at a value that already exists somewhere else.</p>
  </header>

  <figure class="stage-figure" aria-label="Diagram showing x and y as names pointing at value bubbles">
    <div class="stage" id="stage" style="height: 260px;">
      <svg class="connectors" id="connectors" aria-hidden="true">
        <path id="path-x" d=""></path>
        <path id="path-y" d=""></path>
      </svg>
      <div class="names-col" id="names-col">
        <div class="name-tag x" id="tag-x">x</div>
        <div class="name-tag y" id="tag-y">y</div>
      </div>
      <div class="values-col" id="values-col">
        <div class="value-bubble" id="bubble-5">5</div>
        <div class="value-bubble" id="bubble-8">8</div>
      </div>
    </div>
  </figure>

  <div class="caption-box mono" id="caption" aria-live="polite">Press "Step forward" to begin: <b>x = 5</b>.</div>

  <div class="controls">
    <button class="btn-step" id="btn-step"><span class="dot"></span>Step forward</button>
    <button class="btn-reset" id="btn-reset"><span class="dot"></span>Reset</button>
  </div>
</div>

<script>
(function () {
  var stage = document.getElementById('stage');
  var pathX = document.getElementById('path-x');
  var pathY = document.getElementById('path-y');
  var tagX = document.getElementById('tag-x');
  var tagY = document.getElementById('tag-y');
  var bubble5 = document.getElementById('bubble-5');
  var bubble8 = document.getElementById('bubble-8');
  var caption = document.getElementById('caption');
  var btnStep = document.getElementById('btn-step');
  var btnReset = document.getElementById('btn-reset');
  var step = 1;

  function rectRelativeTo(el, container) {
    var r = el.getBoundingClientRect();
    var c = container.getBoundingClientRect();
    return { top: r.top - c.top, left: r.left - c.left, width: r.width, height: r.height };
  }

  function pathBetween(fromEl, toEl) {
    var f = rectRelativeTo(fromEl, stage);
    var t = rectRelativeTo(toEl, stage);
    var x1 = f.left + f.width, y1 = f.top + f.height / 2;
    var x2 = t.left, y2 = t.top + t.height / 2;
    var midX = (x1 + x2) / 2;
    return 'M ' + x1 + ' ' + y1 + ' C ' + midX + ' ' + y1 + ', ' + midX + ' ' + y2 + ', ' + x2 + ' ' + y2;
  }

  function render() {
    tagX.classList.toggle('shown', step >= 1);
    tagY.classList.toggle('shown', step >= 2);
    bubble5.classList.toggle('shown', step >= 1);
    bubble8.classList.toggle('shown', step >= 3);
    bubble5.classList.toggle('stale', step >= 3);

    if (step >= 1) {
      pathX.setAttribute('d', pathBetween(tagX, step >= 3 ? bubble8 : bubble5));
      pathX.classList.add('accent-x');
    } else {
      pathX.setAttribute('d', '');
    }
    if (step >= 2) {
      pathY.setAttribute('d', pathBetween(tagY, bubble5));
      pathY.classList.add('accent-y');
    } else {
      pathY.setAttribute('d', '');
    }

    if (step === 1) {
      caption.innerHTML = '<code>x = 5</code> — the name <b>x</b> now points at the value <b>5</b>. Nothing is copied into "x"; x simply points there.';
    } else if (step === 2) {
      caption.innerHTML = '<code>y = x</code> — <b>y</b> points at whatever <b>x</b> currently points at: the same <b>5</b>. Two names, one value — not two copies.';
    } else {
      caption.innerHTML = '<code>x = 8</code> — <b>x</b> moves to point at a new value, <b>8</b>. <b>y</b> was never linked to x, only to 5 — so y is completely unaffected.';
    }
    btnStep.disabled = step >= 3;
  }

  window.addEventListener('resize', render);
  btnStep.addEventListener('click', function () { if (step < 3) { step += 1; render(); } });
  btnReset.addEventListener('click', function () { step = 1; render(); });

  render();
})();
</script>
