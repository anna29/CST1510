<div class="page">
  <header>
    <span class="eyebrow">Week 3 · Modules</span>
    <h1>import gives you a box, not the names inside it</h1>
    <p><code>import math</code> only binds the name <b>math</b> in your own code — a labelled
      box you reach <i>into</i>. <code>from math import sqrt</code> is what actually copies
      <b>sqrt</b> itself out of that box and into your own namespace.</p>
  </header>

  <figure class="stage-figure" aria-label="Two-track diagram comparing import math with from math import sqrt">
    <div class="tabs" role="tablist" aria-label="Choose which import style to animate">
      <button class="tab tab-a on" id="tab-a" role="tab" aria-selected="true"><span class="dot"></span>import math</button>
      <button class="tab tab-b" id="tab-b" role="tab" aria-selected="false"><span class="dot"></span>from math import sqrt</button>
    </div>

    <!-- Track A: import math -->
    <div class="track-stage active" id="stage-a">
      <div class="stage">
        <div class="method-panel">
          <span class="tag">track A — the module stays a box</span>
          <pre><span class="code-line" id="line-a1">import math</span>
<span class="code-line" id="line-a2">math.sqrt(16)</span></pre>
        </div>

        <div class="right-col">
          <div class="object-card" id="module-a">
            <div class="instance-tag"><b>math</b> — the module (a box of names)</div>
            <div class="tiles">
              <span class="tile" id="tile-a-sqrt">sqrt</span>
              <span class="tile" id="tile-a-floor">floor</span>
              <span class="tile" id="tile-a-ceil">ceil</span>
              <span class="tile" id="tile-a-pi">pi</span>
            </div>
          </div>

          <div class="feed-arrow" id="arrow-a1" aria-hidden="true">&#8595;</div>

          <div class="object-card" id="namespace-a">
            <div class="instance-tag">your code's namespace</div>
            <div class="tiles namespace-tiles" id="namespace-tiles-a">
              <span class="empty-note" id="ns-empty-a">empty</span>
            </div>
          </div>

          <div class="feed-arrow" id="arrow-a2" aria-hidden="true">&#8595;</div>

          <div class="object-card" id="output-a">
            <div class="instance-tag"><code>math.sqrt(16)</code> — output</div>
            <div class="output-slot">
              <span class="placeholder" id="placeholder-a">no call yet</span>
              <span class="result a mono" id="result-a">4.0</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Track B: from math import sqrt -->
    <div class="track-stage" id="stage-b">
      <div class="stage">
        <div class="method-panel">
          <span class="tag">track B — sqrt leaves the box</span>
          <pre><span class="code-line" id="line-b1">from math import sqrt</span>
<span class="code-line" id="line-b2">sqrt(16)</span></pre>
        </div>

        <div class="right-col">
          <div class="object-card" id="module-b">
            <div class="instance-tag"><b>math</b> — the module still loads in full</div>
            <div class="tiles">
              <span class="tile" id="tile-b-sqrt">sqrt</span>
              <span class="tile" id="tile-b-floor">floor</span>
              <span class="tile" id="tile-b-ceil">ceil</span>
              <span class="tile" id="tile-b-pi">pi</span>
            </div>
          </div>

          <div class="feed-arrow" id="arrow-b1" aria-hidden="true">&#8595;</div>

          <div class="object-card" id="namespace-b">
            <div class="instance-tag">your code's namespace</div>
            <div class="tiles namespace-tiles" id="namespace-tiles-b">
              <span class="empty-note" id="ns-empty-b">empty</span>
            </div>
          </div>

          <div class="feed-arrow" id="arrow-b2" aria-hidden="true">&#8595;</div>

          <div class="object-card" id="output-b">
            <div class="instance-tag"><code>sqrt(16)</code> — output</div>
            <div class="output-slot">
              <span class="placeholder" id="placeholder-b">no call yet</span>
              <span class="result b mono" id="result-b">4.0</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <figcaption id="figcaption-text">Press Step to run <code>import math</code>. Watch which name lands
      in your own namespace, and which name stays locked inside the box.</figcaption>
  </figure>

  <div class="controls">
    <button class="btn-step" id="btn-step"><span class="dot"></span>Step</button>
    <button class="btn-reset" id="btn-reset"><span class="dot"></span>Reset</button>
  </div>

  <div class="status mono" id="status" aria-live="polite">Idle — press Step to run the first line.</div>

  <figure class="stage-figure" aria-label="Side by side summary of both namespaces after each import style finishes">
    <span class="section-label">after both run — what's actually in your namespace</span>
    <div class="compare-grid">
      <div class="compare-col">
        <span class="tag">after import math</span>
        <pre>your_namespace = {
    <span class="highlight-line-a">"math"</span>: &lt;module 'math'&gt;
}
<span class="comment"># sqrt only reachable as math.sqrt —
# it was never copied out of the box</span></pre>
      </div>
      <div class="compare-col">
        <span class="tag">after from math import sqrt</span>
        <pre>your_namespace = {
    <span class="highlight-line-b">"sqrt"</span>: &lt;built-in function sqrt&gt;
}
<span class="comment"># math itself isn't bound here at all —
# only the one name you pulled out</span></pre>
      </div>
    </div>
    <figcaption>Same module, two different results. <code>import math</code> leaves you holding
      one box; <code>from math import sqrt</code> leaves you holding one function, taken out of
      that box, with no box in sight.</figcaption>
  </figure>
</div>

<script>
(function () {
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var stepDelay = reduceMotion ? 0 : 300;
  var TOTAL = 2; // step 1 = import/from-import line, step 2 = the call line

  var tabA = document.getElementById('tab-a');
  var tabB = document.getElementById('tab-b');
  var stageA = document.getElementById('stage-a');
  var stageB = document.getElementById('stage-b');
  var btnStep = document.getElementById('btn-step');
  var btnReset = document.getElementById('btn-reset');
  var status = document.getElementById('status');
  var figcaptionText = document.getElementById('figcaption-text');

  var moduleTileIds = ['sqrt', 'floor', 'ceil', 'pi'];

  var track = 'a'; // active track
  var state = {
    a: { step: 0, busy: false },
    b: { step: 0, busy: false }
  };

  function els(t) {
    return {
      line1: document.getElementById('line-' + t + '1'),
      line2: document.getElementById('line-' + t + '2'),
      moduleTiles: moduleTileIds.map(function (n) { return document.getElementById('tile-' + t + '-' + n); }),
      moduleCard: document.getElementById('module-' + t),
      arrow1: document.getElementById('arrow-' + t + '1'),
      arrow2: document.getElementById('arrow-' + t + '2'),
      nsTiles: document.getElementById('namespace-tiles-' + t),
      nsEmpty: document.getElementById('ns-empty-' + t),
      nsCard: document.getElementById('namespace-' + t),
      placeholder: document.getElementById('placeholder-' + t),
      result: document.getElementById('result-' + t),
      outputCard: document.getElementById('output-' + t)
    };
  }

  function flashClass(t) { return t === 'a' ? 'flash-a' : 'flash-b'; }
  function flowClass(t) { return t === 'a' ? 'flow-a' : 'flow-b'; }
  function pulseClass(t) { return t === 'a' ? 'pulse-a' : 'pulse-b'; }

  function clearFlashes(t) {
    var e = els(t);
    e.line1.classList.remove('flash-a', 'flash-b');
    e.line2.classList.remove('flash-a', 'flash-b');
    e.moduleTiles.forEach(function (tile) { tile.classList.remove('flash-a', 'flash-b'); });
    e.arrow1.classList.remove('flow-a', 'flow-b');
    e.arrow2.classList.remove('flow-a', 'flow-b');
    e.moduleCard.classList.remove('pulse-a', 'pulse-b');
    e.nsCard.classList.remove('pulse-a', 'pulse-b');
    e.outputCard.classList.remove('pulse-a', 'pulse-b');
  }

  function setResult(t, shown) {
    var e = els(t);
    e.placeholder.style.display = shown ? 'none' : '';
    e.result.classList.toggle('shown', shown);
  }

  function resetTrack(t) {
    var e = els(t);
    state[t] = { step: 0, busy: false };
    clearFlashes(t);
    e.moduleTiles.forEach(function (tile) { tile.classList.remove('loaded', 'entering'); });
    e.nsTiles.innerHTML = '<span class="empty-note" id="ns-empty-' + t + '">empty</span>';
    setResult(t, false);
  }

  function importLine(t) {
    var e = els(t);
    var fc = flashClass(t);
    e.line1.classList.add(fc);
    e.moduleCard.classList.add(pulseClass(t));
    e.moduleTiles.forEach(function (tile, i) {
      setTimeout(function () { tile.classList.add('loaded', 'entering'); }, i * 60);
    });

    if (t === 'a') {
      status.innerHTML = '<b>import math</b> loads the module and binds <b>one</b> name in your namespace: <b>math</b> — the box itself, not what is inside it.';
    } else {
      status.innerHTML = 'Python loads the <b>whole</b> math module first, just like <b>import math</b> does — every name gets created inside the box.';
    }

    setTimeout(function () {
      e.line1.classList.remove(fc);
      e.arrow1.classList.add(flowClass(t));
      e.nsCard.classList.add(pulseClass(t));
    }, stepDelay);

    setTimeout(function () {
      e.arrow1.classList.remove(flowClass(t));
      e.nsCard.classList.remove(pulseClass(t));
      e.moduleCard.classList.remove(pulseClass(t));
      var empty = document.getElementById('ns-empty-' + t);
      if (empty) empty.remove();
      var tile = document.createElement('span');
      tile.className = 'tile loaded entering';
      if (t === 'a') {
        tile.classList.add('tile-box');
        tile.innerHTML = 'math<span class="box-sub">a box — reach in with math.___</span>';
        status.innerHTML = 'Your namespace now holds <b>math</b> only. <b>sqrt</b> lives inside that box — never copied out.';
      } else {
        tile.textContent = 'sqrt';
        status.innerHTML = '<b>from math import sqrt</b> then copies just <b>sqrt</b> out of the box, straight into your namespace.';
      }
      e.nsTiles.appendChild(tile);
      state[t].busy = false;
      btnStep.disabled = false;
    }, stepDelay * 2);
  }

  function callLine(t) {
    var e = els(t);
    var fc = flashClass(t);
    e.line2.classList.add(fc);

    if (t === 'a') {
      status.innerHTML = '<b>math.sqrt(16)</b> — Python follows the dot, reaching back <b>into</b> the math box to find sqrt.';
      e.arrow1.classList.add(flowClass(t));
      e.moduleCard.classList.add(pulseClass(t));
      var mathTile = e.nsTiles.querySelector('.tile-box');
      if (mathTile) mathTile.classList.add(fc);
    } else {
      status.innerHTML = '<b>sqrt(16)</b> — no box to reach into this time. sqrt already lives directly in your namespace.';
      var sqrtTile = e.nsTiles.querySelector('.tile');
      if (sqrtTile) sqrtTile.classList.add(fc);
    }

    setTimeout(function () {
      var sqrtIndex = moduleTileIds.indexOf('sqrt');
      e.moduleTiles[sqrtIndex].classList.add(fc);
      if (t === 'a') {
        status.innerHTML = '<b>sqrt</b> is found inside <b>math</b>, called with 16, and the result is handed back out — <b>sqrt</b> itself still never enters your namespace.';
      }
    }, stepDelay);

    setTimeout(function () {
      e.arrow2.classList.add(flowClass(t));
      e.outputCard.classList.add(pulseClass(t));
    }, stepDelay * 1.6);

    setTimeout(function () {
      e.line2.classList.remove(fc);
      e.arrow1.classList.remove(flowClass(t));
      e.arrow2.classList.remove(flowClass(t));
      e.moduleCard.classList.remove(pulseClass(t));
      e.outputCard.classList.remove(pulseClass(t));
      e.moduleTiles[moduleTileIds.indexOf('sqrt')].classList.remove(fc);
      var boxTile = e.nsTiles.querySelector('.tile');
      if (boxTile) boxTile.classList.remove(fc);
      setResult(t, true);
      if (t === 'a') {
        status.innerHTML = 'Result: <b>4.0</b>. Every call to <b>math.sqrt</b> reaches into the box again — sqrt never moves in.';
      } else {
        status.innerHTML = 'Result: <b>4.0</b>. The call went straight to <b>sqrt</b> in your own namespace — no dot, no reaching in.';
      }
      state[t].busy = false;
      btnStep.disabled = false;
    }, stepDelay * 3);
  }

  function finishTrack(t) {
    if (t === 'a') {
      status.innerHTML = 'Done. Namespace after track A: just <b>{ math }</b>. <b>sqrt</b> is only ever reachable as <b>math.sqrt</b>.';
    } else {
      status.innerHTML = 'Done. Namespace after track B: just <b>{ sqrt }</b>. <b>math</b> itself was never bound here.';
    }
  }

  function doStep() {
    var s = state[track];
    if (s.busy) return;
    if (s.step === 0) {
      s.busy = true;
      btnStep.disabled = true;
      s.step = 1;
      importLine(track);
    } else if (s.step === 1) {
      s.busy = true;
      btnStep.disabled = true;
      s.step = 2;
      callLine(track);
    } else {
      finishTrack(track);
    }
  }

  function reset() {
    resetTrack(track);
    status.textContent = track === 'a'
      ? 'Idle — press Step to run import math.'
      : 'Idle — press Step to run from math import sqrt.';
    btnStep.disabled = false;
  }

  function switchTrack(next) {
    if (track === next) return;
    track = next;
    stageA.classList.toggle('active', next === 'a');
    stageB.classList.toggle('active', next === 'b');
    tabA.classList.toggle('on', next === 'a');
    tabB.classList.toggle('on', next === 'b');
    tabA.setAttribute('aria-selected', next === 'a' ? 'true' : 'false');
    tabB.setAttribute('aria-selected', next === 'b' ? 'true' : 'false');
    resetTrack('a');
    resetTrack('b');
    figcaptionText.innerHTML = next === 'a'
      ? 'Press Step to run <code>import math</code>. Watch which name lands in your own namespace, and which name stays locked inside the box.'
      : 'Press Step to run <code>from math import sqrt</code>. Watch the name <code>sqrt</code> leave the box entirely.';
    status.textContent = next === 'a'
      ? 'Idle — press Step to run import math.'
      : 'Idle — press Step to run from math import sqrt.';
    btnStep.disabled = false;
  }

  tabA.addEventListener('click', function () { switchTrack('a'); });
  tabB.addEventListener('click', function () { switchTrack('b'); });
  btnStep.addEventListener('click', doStep);
  btnReset.addEventListener('click', reset);
})();
</script>
